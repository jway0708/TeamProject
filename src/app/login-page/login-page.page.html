<ion-header class="ion-no-border">
  <ion-toolbar color="light">
    <ion-title>Sign In</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="auth-container">
    <h2>Welcome Back</h2>
    <p class="subtitle">Please enter your details to sign in</p>

    <!-- Segment 切换登录/注册模式 -->
    <ion-segment [(ngModel)]="isRegister" (ionChange)="resetForm()">
      <ion-segment-button [value]="false">
        <ion-label>Login</ion-label>
      </ion-segment-button>
      <ion-segment-button [value]="true">
        <ion-label>Register</ion-label>
      </ion-segment-button>
    </ion-segment>

    <form (ngSubmit)="onSubmit()" class="ion-margin-top">
      <!-- Phone Number -->
      <ion-item lines="none">
        <ion-label position="floating">Phone Number</ion-label>
        <ion-input type="tel" [(ngModel)]="phoneNumber" name="phoneNumber" placeholder="e.g. 0123456789" required></ion-input>
      </ion-item>

      <!-- Referral Code (仅注册模式显示) -->
      <ion-item lines="none" *ngIf="isRegister">
        <ion-label position="floating">Referral Code (Optional)</ion-label>
        <ion-input type="text" [(ngModel)]="referralCode" name="referralCode" (ionBlur)="onCheckReferral()"></ion-input>
      </ion-item>

      <!-- OTP Code + Get OTP Button -->
      <ion-item lines="none">
        <ion-label position="floating">OTP Code</ion-label>
        <ion-input type="number" [(ngModel)]="otpCode" name="otpCode" required></ion-input>
        <ion-button slot="end" fill="clear" (click)="onSendOtp()" [disabled]="countdown > 0">
          {{ countdown > 0 ? countdown + 's' : 'Get OTP' }}
        </ion-button>
      </ion-item>

      <!-- Submit Button -->
      <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="!phoneNumber || !otpCode">
        {{ isRegister ? 'Register' : 'Login' }}
      </ion-button>
    </form>
  </div>
</ion-content>
